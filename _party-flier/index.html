<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Invasion Party Flyer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 50%, #2d1b69 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .flyer {
            width: 400px;
            height: 600px;
            margin: 20px auto;
            background: linear-gradient(45deg, #000814, #001d3d, #003566);
            border: 3px solid #00f5ff;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.5), inset 0 0 20px rgba(0, 245, 255, 0.1);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 30px rgba(0, 245, 255, 0.5), inset 0 0 20px rgba(0, 245, 255, 0.1); }
            to { box-shadow: 0 0 50px rgba(0, 245, 255, 0.8), inset 0 0 30px rgba(0, 245, 255, 0.2); }
        }
        
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 3s ease-in-out infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .ufo {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            background: linear-gradient(to bottom, #silver, #gray);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: float 3s ease-in-out infinite;
        }
        
        .ufo::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 20px;
            background: linear-gradient(to bottom, #4a9eff, #0066cc);
            border-radius: 50%;
        }
        
        .ufo::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 30px;
            background: linear-gradient(to bottom, rgba(0, 245, 255, 0.3), transparent);
            border-radius: 50%;
            filter: blur(5px);
        }
        
        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0px); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
        
        .title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 28px;
            color: #00f5ff;
            text-align: center;
            margin-top: 80px;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.8);
            line-height: 1.1;
        }
        
        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: 14px;
            color: #ff6b35;
            text-align: center;
            margin-top: 10px;
            text-shadow: 0 0 5px rgba(255, 107, 53, 0.6);
        }
        
        .yoga-section {
            margin: 30px 20px;
            text-align: center;
        }
        
        .yoga-figures {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        
        .yoga-person {
            width: 60px;
            height: 60px;
            position: relative;
        }
        
        .yoga-person-1 {
            /* Tree pose */
            border-left: 3px solid #00f5ff;
            border-bottom: 2px solid #00f5ff;
            border-radius: 0 0 0 50%;
            transform: rotate(-10deg);
        }
        
        .yoga-person-1::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -8px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00f5ff;
        }
        
        .yoga-person-1::after {
            content: '';
            position: absolute;
            top: 10px;
            right: -20px;
            width: 25px;
            height: 2px;
            background: #00f5ff;
            transform: rotate(30deg);
        }
        
        .yoga-person-2 {
            /* Downward dog */
            border-top: 3px solid #ff6b35;
            border-left: 3px solid #ff6b35;
            border-radius: 50% 0 0 0;
            transform: rotate(45deg);
        }
        
        .yoga-person-2::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff6b35;
        }
        
        .yoga-person-2::after {
            content: '';
            position: absolute;
            bottom: -20px;
            right: -15px;
            width: 3px;
            height: 20px;
            background: #ff6b35;
        }
        
        .yoga-person-3 {
            /* Warrior pose */
            border-bottom: 3px solid #39ff14;
            border-right: 2px solid #39ff14;
            border-radius: 0 0 50% 0;
            transform: rotate(20deg);
        }
        
        .yoga-person-3::before {
            content: '';
            position: absolute;
            top: -15px;
            right: -8px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #39ff14;
        }
        
        .yoga-person-3::after {
            content: '';
            position: absolute;
            top: 5px;
            left: -25px;
            width: 30px;
            height: 2px;
            background: #39ff14;
            transform: rotate(-20deg);
        }
        
        .event-details {
            color: #fff;
            text-align: center;
            margin: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .date {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #00f5ff;
            margin: 15px 0;
            text-shadow: 0 0 8px rgba(0, 245, 255, 0.6);
        }
        
        .yoga-text {
            color: #39ff14;
            font-weight: 700;
            margin: 15px 0;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.4);
        }
        
        .bottom-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff6b35;
            font-size: 12px;
            text-align: center;
            font-weight: 700;
            text-shadow: 0 0 5px rgba(255, 107, 53, 0.4);
        }
        
        .alien-emoji {
            font-size: 24px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        .glow-text {
            animation: textGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes textGlow {
            from { text-shadow: 0 0 10px rgba(0, 245, 255, 0.8); }
            to { text-shadow: 0 0 20px rgba(0, 245, 255, 1), 0 0 30px rgba(0, 245, 255, 0.8); }
        }
    </style>
</head>
<body>
    <div class="flyer">
        <div class="stars"></div>
        <div class="ufo"></div>
        
        <div class="title glow-text">
            ALIEN<br>INVASION<br>PARTY
        </div>
        
        <div class="subtitle">
            🛸 FIRST CONTACT CELEBRATION 🛸
        </div>
        
        <div class="yoga-section">
            <div class="yoga-text">INTERGALACTIC YOGA SESSION</div>
            <div class="yoga-figures">
                <div class="yoga-person yoga-person-1"></div>
                <div class="yoga-person yoga-person-2"></div>
                <div class="yoga-person yoga-person-3"></div>
            </div>
        </div>
        
        <div class="event-details">
            <div class="date">DECEMBER 2026</div>
            <div>Join us for the ultimate</div>
            <div>extraterrestrial experience!</div>
            <br>
            <div>🧘‍♀️ Cosmic Yoga with Aliens</div>
            <div>🎵 Intergalactic Music</div>
            <div>🍕 Earth & Alien Cuisine</div>
            <div>✨ Mind-Melding Activities</div>
        </div>
        
        <div class="bottom-text">
            <div class="alien-emoji">👽</div>
            PREPARE FOR CONTACT!
        </div>
    </div>
</body>
</html>
