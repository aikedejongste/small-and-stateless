    function getMoonPhase(date) {
      const knownNewMoon = new Date(Date.UTC(2000, 0, 6, 18, 14, 0));
      const synodicMonth = 29.53058867;
      const daysSinceKnown = (date.getTime() - knownNewMoon.getTime()) / (1000 * 60 * 60 * 24);
      return ((daysSinceKnown % synodicMonth) + synodicMonth) % synodicMonth;
    }

    function getMoonPhaseName(phase) {
      const eighth = 29.53058867 / 8;
      if (phase < eighth) return { name: 'New Moon', emoji: '🌑', category: 'new', shortName: 'New' };
      if (phase < eighth * 2) return { name: 'Waxing Crescent', emoji: '🌒', category: 'waxing_crescent', shortName: 'Wax Cres' };
      if (phase < eighth * 3) return { name: 'First Quarter', emoji: '🌓', category: 'first_quarter', shortName: '1st Qtr' };
      if (phase < eighth * 4) return { name: 'Waxing Gibbous', emoji: '🌔', category: 'waxing_gibbous', shortName: 'Wax Gib' };
      if (phase < eighth * 5) return { name: 'Full Moon', emoji: '🌕', category: 'full', shortName: 'Full' };
      if (phase < eighth * 6) return { name: 'Waning Gibbous', emoji: '🌖', category: 'waning_gibbous', shortName: 'Wan Gib' };
      if (phase < eighth * 7) return { name: 'Last Quarter', emoji: '🌗', category: 'last_quarter', shortName: 'Last Qtr' };
      return { name: 'Waning Crescent', emoji: '🌘', category: 'waning_crescent', shortName: 'Wan Cres' };
    }

    function getMoonIllumination(phase) {
      return (1 - Math.cos((phase / 29.53058867) * 2 * Math.PI)) / 2;
    }

    function parseDuration(dur) {
      if (!dur) return 0;
      const match = dur.match(/(\d+)h\s*(\d+)?min?/);
      return match ? parseInt(match[1]) + (parseInt(match[2] || 0) / 60) : 0;
    }

    const sleepData = rawData.split('\n').map(line => {
      const [dateStr, score, rhr, quality, duration] = line.split(',');
      const date = new Date(dateStr + 'T00:00:00');
      return {
        date,
        dateStr,
        score: parseInt(score),
        rhr: parseFloat(rhr),
        quality,
        duration,
        durationHours: parseDuration(duration),
        moonPhase: getMoonPhase(date),
        moonInfo: getMoonPhaseName(getMoonPhase(date)),
        moonIllumination: getMoonIllumination(getMoonPhase(date))
      };
    }).filter(d => !isNaN(d.score));

    function SleepMoonAnalysis() {
      const [view, setView] = useState('scatter');
      const [metric, setMetric] = useState('score');
      
      const stats = useMemo(() => {
        const phases = {};
        const phaseOrder = ['new', 'waxing_crescent', 'first_quarter', 'waxing_gibbous', 'full', 'waning_gibbous', 'last_quarter', 'waning_crescent'];
        phaseOrder.forEach(p => phases[p] = { scores: [], durations: [], rhrs: [] });
        
        sleepData.forEach(d => {
          phases[d.moonInfo.category].scores.push(d.score);
          phases[d.moonInfo.category].durations.push(d.durationHours);
          phases[d.moonInfo.category].rhrs.push(d.rhr);
        });
        
        return phaseOrder.map(cat => {
          const data = phases[cat];
          const avg = arr => arr.length ? arr.reduce((a,b) => a+b, 0) / arr.length : 0;
          const info = getMoonPhaseName(phaseOrder.indexOf(cat) * 3.69);
          return {
            category: cat,
            avgScore: avg(data.scores).toFixed(1),
            avgDuration: avg(data.durations).toFixed(2),
            avgRhr: avg(data.rhrs).toFixed(1),
            count: data.scores.length,
            emoji: info.emoji,
            name: info.shortName
          };
        });
      }, []);
      
      const correlation = useMemo(() => {
        const n = sleepData.length;
        const illuminations = sleepData.map(d => d.moonIllumination);
        const values = sleepData.map(d => metric === 'score' ? d.score : metric === 'duration' ? d.durationHours : d.rhr);
        const mean = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
        const meanIll = mean(illuminations), meanVal = mean(values);
        let num = 0, denIll = 0, denVal = 0;
        for (let i = 0; i < n; i++) {
          const di = illuminations[i] - meanIll, dv = values[i] - meanVal;
          num += di * dv; denIll += di * di; denVal += dv * dv;
        }
        return (num / Math.sqrt(denIll * denVal)).toFixed(3);
      }, [metric]);
      
      const avgScore = (sleepData.reduce((a, b) => a + b.score, 0) / sleepData.length).toFixed(1);
      const maxEntry = sleepData.reduce((a, b) => a.score > b.score ? a : b);
      const minEntry = sleepData.reduce((a, b) => a.score < b.score ? a : b);
      
      const firstDate = sleepData[0]?.dateStr.slice(0, 7).replace('-', ' ');
      const lastDate = sleepData[sleepData.length - 1]?.dateStr.slice(0, 7).replace('-', ' ');

      const styles = {
        container: {
          minHeight: '100vh',
          background: 'linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 40%, #16213e 70%, #0d0d1a 100%)',
          color: '#e0e0f0',
          fontFamily: "'Crimson Pro', Georgia, serif",
          padding: '2rem',
          position: 'relative'
        },
        stars: {
          position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
          background: `radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), transparent),
                       radial-gradient(1.5px 1.5px at 30% 10%, #fff, transparent),
                       radial-gradient(1px 1px at 50% 30%, rgba(255,255,255,0.6), transparent),
                       radial-gradient(2px 2px at 70% 15%, #fff, transparent),
                       radial-gradient(1px 1px at 85% 25%, rgba(255,255,255,0.7), transparent),
                       radial-gradient(1px 1px at 15% 45%, #fff, transparent),
                       radial-gradient(1.5px 1.5px at 40% 55%, rgba(255,255,255,0.5), transparent),
                       radial-gradient(1px 1px at 60% 40%, #fff, transparent),
                       radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.6), transparent),
                       radial-gradient(2px 2px at 25% 70%, #fff, transparent)`,
          opacity: 0.5, pointerEvents: 'none', zIndex: 0
        },
        content: { position: 'relative', zIndex: 1, maxWidth: '1200px', margin: '0 auto' },
        title: {
          fontSize: '2.4rem', fontWeight: 300, letterSpacing: '0.12em',
          textTransform: 'uppercase', margin: 0,
          background: 'linear-gradient(180deg, #f8f8ff 0%, #9999cc 100%)',
          WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent'
        },
        statsGrid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: '1rem', marginBottom: '2rem' },
        statCard: {
          background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.08)',
          borderRadius: '12px', padding: '1.2rem', textAlign: 'center', backdropFilter: 'blur(8px)'
        },
        controls: { display: 'flex', justifyContent: 'center', gap: '0.8rem', marginBottom: '1.5rem', flexWrap: 'wrap' },
        button: (active) => ({
          background: active ? 'rgba(255,255,255,0.12)' : 'transparent',
          border: '1px solid rgba(255,255,255,0.15)', color: '#e0e0f0', padding: '0.5rem 1.2rem',
          borderRadius: '16px', cursor: 'pointer', fontSize: '0.85rem', letterSpacing: '0.05em', textTransform: 'uppercase'
        }),
        select: {
          background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)',
          color: '#e0e0f0', padding: '0.5rem 1rem', borderRadius: '16px', fontSize: '0.85rem', cursor: 'pointer'
        },
        chartBox: { background: 'rgba(0,0,0,0.25)', borderRadius: '16px', padding: '1.5rem', border: '1px solid rgba(255,255,255,0.05)' },
        analysis: { marginTop: '1.5rem', padding: '1.2rem', background: 'rgba(255,255,255,0.02)', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.05)' }
      };

      return (
        <div style={styles.container}>
          <div style={styles.stars} />
          <div style={styles.content}>
            <header style={{ textAlign: 'center', marginBottom: '2.5rem' }}>
              <div style={{ fontSize: '3.5rem', marginBottom: '0.5rem' }}>🌙</div>
              <h1 style={styles.title}>Lunar Sleep Analysis</h1>
              <p style={{ fontSize: '1rem', opacity: 0.5, marginTop: '0.5rem', letterSpacing: '0.08em' }}>
                {sleepData.length} nights · {firstDate} — {lastDate}
              </p>
            </header>

            <div style={styles.statsGrid}>
              {[
                { label: 'Avg Score', value: avgScore, sub: '/100' },
                { label: 'Best Night', value: maxEntry.score, sub: maxEntry.dateStr },
                { label: 'Worst Night', value: minEntry.score, sub: minEntry.dateStr },
                { label: 'Correlation', value: correlation, sub: `vs ${metric}` }
              ].map((s, i) => (
                <div key={i} style={styles.statCard}>
                  <div style={{ fontSize: '2rem', fontWeight: 300, color: '#b8b8ff', fontFamily: "'DM Mono', monospace" }}>{s.value}</div>
                  <div style={{ fontSize: '0.8rem', textTransform: 'uppercase', letterSpacing: '0.08em', opacity: 0.6, marginTop: '0.2rem' }}>{s.label}</div>
                  <div style={{ fontSize: '0.7rem', opacity: 0.35, marginTop: '0.1rem' }}>{s.sub}</div>
                </div>
              ))}
            </div>

            <div style={styles.controls}>
              {['scatter', 'phases', 'timeline'].map(v => (
                <button key={v} onClick={() => setView(v)} style={styles.button(view === v)}>
                  {v === 'scatter' ? '⚡ Scatter' : v === 'phases' ? '🌙 Phases' : '📈 Timeline'}
                </button>
              ))}
              <select value={metric} onChange={e => setMetric(e.target.value)} style={styles.select}>
                <option value="score">Sleep Score</option>
                <option value="duration">Duration</option>
                <option value="rhr">Resting HR</option>
              </select>
            </div>

            {view === 'scatter' && (
              <div style={styles.chartBox}>
                <h2 style={{ fontSize: '1.1rem', fontWeight: 400, marginBottom: '1rem', opacity: 0.7 }}>
                  Moon Illumination vs {metric === 'score' ? 'Sleep Score' : metric === 'duration' ? 'Duration (hrs)' : 'Resting HR'}
                </h2>
                <div style={{ position: 'relative', height: '350px', marginBottom: '1rem' }}>
                  <div style={{ position: 'absolute', left: 0, top: 0, bottom: '30px', width: '40px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', fontSize: '0.7rem', opacity: 0.4, textAlign: 'right', paddingRight: '8px' }}>
                    <span>{metric === 'score' ? '100' : metric === 'duration' ? '10' : '75'}</span>
                    <span>{metric === 'score' ? '75' : metric === 'duration' ? '8' : '65'}</span>
                    <span>{metric === 'score' ? '50' : metric === 'duration' ? '6' : '55'}</span>
                    <span>{metric === 'score' ? '25' : metric === 'duration' ? '4' : '45'}</span>
                  </div>
                  <div style={{ marginLeft: '45px', height: 'calc(100% - 30px)', position: 'relative', borderLeft: '1px solid rgba(255,255,255,0.1)', borderBottom: '1px solid rgba(255,255,255,0.1)' }}>
                    {['🌑', '🌓', '🌕', '🌗', '🌑'].map((e, i) => (
                      <div key={i} style={{ position: 'absolute', left: `${i * 25}%`, bottom: '-25px', fontSize: '1rem', transform: i === 0 ? 'none' : i === 4 ? 'translateX(-100%)' : 'translateX(-50%)' }}>{e}</div>
                    ))}
                    {[25, 50, 75].map(pct => (
                      <div key={pct} style={{ position: 'absolute', left: 0, right: 0, top: `${100 - pct}%`, borderTop: '1px dashed rgba(255,255,255,0.05)' }} />
                    ))}
                    {sleepData.map((d, i) => {
                      const val = metric === 'score' ? d.score : metric === 'duration' ? d.durationHours : d.rhr;
                      const yPct = metric === 'score' ? val : metric === 'duration' ? ((val - 3) / 7) * 100 : ((75 - val) / 30) * 100;
                      const color = d.quality === 'Good' || d.quality === 'Excellent' ? '#88ff88' : d.quality === 'Fair' ? '#a8a8ff' : '#ff8888';
                      return (
                        <div key={i} style={{
                          position: 'absolute', left: `${d.moonIllumination * 100}%`, bottom: `${yPct}%`,
                          width: '8px', height: '8px', background: color, borderRadius: '50%',
                          transform: 'translate(-50%, 50%)', opacity: 0.6, cursor: 'pointer'
                        }} title={`${d.dateStr}\n${d.moonInfo.emoji} ${d.moonInfo.name}\nScore: ${d.score} · ${d.duration}`} />
                      );
                    })}
                  </div>
                </div>
                <div style={{ display: 'flex', justifyContent: 'center', gap: '1.5rem', fontSize: '0.75rem', opacity: 0.6 }}>
                  <span><span style={{ color: '#88ff88' }}>●</span> Good/Excellent</span>
                  <span><span style={{ color: '#a8a8ff' }}>●</span> Fair</span>
                  <span><span style={{ color: '#ff8888' }}>●</span> Poor</span>
                </div>
              </div>
            )}

            {view === 'phases' && (
              <div style={styles.chartBox}>
                <h2 style={{ fontSize: '1.1rem', fontWeight: 400, marginBottom: '1.5rem', opacity: 0.7 }}>
                  Average {metric === 'score' ? 'Sleep Score' : metric === 'duration' ? 'Duration' : 'RHR'} by Moon Phase
                </h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: '0.8rem' }}>
                  {stats.map((s, i) => {
                    const val = metric === 'score' ? s.avgScore : metric === 'duration' ? s.avgDuration : s.avgRhr;
                    const barHeight = metric === 'score' ? val : metric === 'duration' ? (parseFloat(s.avgDuration) / 10) * 100 : ((75 - parseFloat(s.avgRhr)) / 20) * 100;
                    return (
                      <div key={i} style={{ background: 'rgba(255,255,255,0.02)', borderRadius: '10px', padding: '1rem', textAlign: 'center', position: 'relative', overflow: 'hidden' }}>
                        <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: `${Math.min(barHeight, 100)}%`, background: 'linear-gradient(180deg, rgba(140,140,220,0.2) 0%, rgba(100,100,180,0.05) 100%)', transition: 'height 0.4s ease' }} />
                        <div style={{ position: 'relative', zIndex: 1 }}>
                          <div style={{ fontSize: '2rem', marginBottom: '0.3rem' }}>{s.emoji}</div>
                          <div style={{ fontSize: '1.5rem', fontWeight: 300, color: '#b8b8ff', fontFamily: "'DM Mono', monospace" }}>{val}</div>
                          <div style={{ fontSize: '0.7rem', opacity: 0.5, marginTop: '0.2rem' }}>{s.name}</div>
                          <div style={{ fontSize: '0.65rem', opacity: 0.3 }}>n={s.count}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {view === 'timeline' && (
              <div style={styles.chartBox}>
                <h2 style={{ fontSize: '1.1rem', fontWeight: 400, marginBottom: '1rem', opacity: 0.7 }}>
                  {metric === 'score' ? 'Sleep Score' : metric === 'duration' ? 'Duration' : 'RHR'} Over Time
                </h2>
                <div style={{ position: 'relative', height: '300px' }}>
                  <div style={{ marginLeft: '35px', height: '100%', position: 'relative', borderLeft: '1px solid rgba(255,255,255,0.1)', borderBottom: '1px solid rgba(255,255,255,0.1)' }}>
                    {sleepData.map((d, i) => {
                      const val = metric === 'score' ? d.score : metric === 'duration' ? d.durationHours : d.rhr;
                      const yPct = metric === 'score' ? val : metric === 'duration' ? ((val - 3) / 7) * 100 : ((75 - val) / 20) * 100;
                      return (
                        <div key={i} style={{
                          position: 'absolute', left: `${(i / (sleepData.length - 1)) * 100}%`, bottom: `${yPct}%`,
                          transform: 'translate(-50%, 50%)', fontSize: '0.7rem', cursor: 'pointer', opacity: 0.7
                        }} title={`${d.dateStr}: ${d.score} · ${d.moonInfo.name}`}>{d.moonInfo.emoji}</div>
                      );
                    })}
                  </div>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginLeft: '35px', marginTop: '0.5rem', fontSize: '0.7rem', opacity: 0.4 }}>
                  <span>{firstDate}</span><span>→</span><span>{lastDate}</span>
                </div>
              </div>
            )}

            <div style={styles.analysis}>
              <h3 style={{ fontSize: '0.95rem', fontWeight: 400, marginBottom: '0.8rem', opacity: 0.8 }}>📋 Statistical Analysis</h3>
              <div style={{ fontSize: '0.9rem', lineHeight: 1.7, opacity: 0.7 }}>
                <p style={{ marginBottom: '0.6rem' }}>
                  With <strong style={{ color: '#b8b8ff' }}>{sleepData.length} nightly observations</strong> and a correlation of <strong style={{ color: '#b8b8ff' }}>{correlation}</strong>, 
                  your data shows {Math.abs(parseFloat(correlation)) < 0.1 ? 'essentially no relationship' : Math.abs(parseFloat(correlation)) < 0.2 ? 'a very weak relationship' : Math.abs(parseFloat(correlation)) < 0.3 ? 'a weak relationship' : 'a moderate relationship'} between moon illumination and sleep {metric}.
                </p>
                <p style={{ marginBottom: '0.6rem' }}>
                  <strong style={{ color: '#88cc88' }}>Best phase:</strong> {stats.sort((a,b) => parseFloat(b.avgScore) - parseFloat(a.avgScore))[0]?.emoji} {stats.sort((a,b) => parseFloat(b.avgScore) - parseFloat(a.avgScore))[0]?.name} (avg {stats.sort((a,b) => parseFloat(b.avgScore) - parseFloat(a.avgScore))[0]?.avgScore})
                  {' · '}
                  <strong style={{ color: '#cc8888' }}>Worst:</strong> {stats.sort((a,b) => parseFloat(a.avgScore) - parseFloat(b.avgScore))[0]?.emoji} {stats.sort((a,b) => parseFloat(a.avgScore) - parseFloat(b.avgScore))[0]?.name} (avg {stats.sort((a,b) => parseFloat(a.avgScore) - parseFloat(b.avgScore))[0]?.avgScore})
                </p>
                <p style={{ opacity: 0.5, fontSize: '0.8rem' }}>
                  Note: Scientific consensus is that moon phases have no measurable effect on human sleep. Any patterns here are likely coincidental.
                </p>
              </div>
            </div>
            
            <footer style={{ textAlign: 'center', marginTop: '2rem', opacity: 0.25, fontSize: '0.75rem', letterSpacing: '0.08em' }}>
              Data from Garmin Connect · Synodic lunar calculation
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SleepMoonAnalysis />);
  </script>
</body>
</html>
