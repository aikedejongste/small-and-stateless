# Stops shown on the map and in the "Stops along the way" section.
# lat/lon in decimal degrees.
stops:
  - name: "Maaspoort, Den Bosch"
    country: "Netherlands"
    lat: 51.727
    lon: 5.318
    blurb: "Kilometre zero. Coffee, group photo, go."

  - name: "Transfăgărășan"
    country: "Romania"
    lat: 45.604
    lon: 24.617
    gmaps: "https://maps.app.goo.gl/f8coEPg5VgYobFo27"
    blurb: "The hairpin road over the Făgăraș ridge — ridden for its own sake, not to get anywhere."

  - name: "Mina Unirea, Slănic"
