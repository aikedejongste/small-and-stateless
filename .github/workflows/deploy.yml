name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed for the Pages deployment to authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true

      # Everything except longwaylanta/ is plain static files that ship as-is;
      # longwaylanta/ is Hugo source and must be built rather than copied.
      - name: Assemble site
        run: |
          mkdir -p dist
          tar -cf - \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./.gitignore \
            --exclude=./dist \
            --exclude=./longwaylanta \
            --exclude=CLAUDE.md \
            . | tar -xf - -C dist
          hugo --gc --minify \
            --source longwaylanta \
            --destination "$GITHUB_WORKSPACE/dist/longwaylanta"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
