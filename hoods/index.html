<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD400">
<title>Which Ortsteil — Berlin</title>
<style>
:root{
  --signal:#FFD400;
  --signal-lo:#E4BD00;
  --ink:#0E0E0E;
  --paper:#EEEBE2;
  --paper-lo:#D8D4C8;
  --blue:#0A4EA2;
  --ink-60:rgba(14,14,14,.60);
  --ink-30:rgba(14,14,14,.30);
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);color:var(--paper);
  font-family:var(--display);
  display:flex;flex-direction:column;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top);
}

/* ── the plate ─────────────────────────────── */
.plate{
  background:var(--signal);color:var(--ink);
  padding:14px 18px 13px;
  border-bottom:4px solid var(--ink);
  flex:0 0 auto;position:relative;z-index:3;
}
.plate-top{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;margin-bottom:6px;
}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-60);white-space:nowrap;
}
.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap;
  border:1.5px solid var(--ink);border-radius:99px;
  padding:2.5px 8px;color:var(--ink);
}
.chip[data-tone="live"]{background:var(--ink);color:var(--signal)}
.chip[data-tone="warn"]{background:transparent;border-style:dashed;color:var(--ink-60)}
h1#name{
  font-size:52px;line-height:.92;font-weight:900;
  letter-spacing:-.035em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;
  transform-origin:left center;
}
.meta{
  margin-top:9px;font-size:13px;line-height:1.35;color:var(--ink-60);
  font-weight:500;
}
.meta b{color:var(--ink);font-weight:700}

/* name change animation */
@keyframes snap{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
#name-in{display:inline-block}
.snap{animation:snap .28s cubic-bezier(.2,.8,.3,1) both}

/* ── border strip ──────────────────────────── */
.strip{
  flex:0 0 auto;background:var(--ink);
  border-bottom:1px solid rgba(238,235,226,.16);
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  position:relative;z-index:2;
}
.strip::-webkit-scrollbar{display:none}
.strip-lbl{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(238,235,226,.4);
  padding:9px 12px 9px 18px;white-space:nowrap;align-self:center;
  border-right:1px solid rgba(238,235,226,.16);
}
.edge{
  display:flex;align-items:center;gap:7px;
  padding:9px 14px;white-space:nowrap;
  border-right:1px solid rgba(238,235,226,.16);
  background:none;border-top:0;border-left:0;border-bottom:0;
  color:var(--paper);font-family:inherit;cursor:pointer;
}
.edge:last-child{border-right:0}
.edge:hover .edge-n,.edge:focus-visible .edge-n{color:var(--signal)}
.edge:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.arrow{font-size:13px;color:var(--signal);line-height:1;display:inline-block}
.edge-n{font-size:13px;font-weight:600;letter-spacing:-.01em}
.edge-d{font-family:var(--mono);font-size:11px;color:rgba(238,235,226,.5)}

/* ── map ───────────────────────────────────── */
.map{flex:1 1 auto;position:relative;overflow:hidden;background:var(--ink);touch-action:none}
svg{display:block;width:100%;height:100%;cursor:grab}
svg.dragging{cursor:grabbing}
.ot{fill:var(--paper);stroke:rgba(14,14,14,.42);stroke-width:1.1;vector-effect:non-scaling-stroke}
.ot.here{fill:var(--signal)}
.ot.pick{fill:#FFF6C9}
.bz{fill:none;stroke:rgba(14,14,14,.85);stroke-width:2.2;vector-effect:non-scaling-stroke;pointer-events:none}
.city{fill:none;stroke:var(--paper);stroke-width:2.6;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.55}
#acc{fill:rgba(10,78,162,.18);stroke:var(--blue);stroke-width:1.5;vector-effect:non-scaling-stroke}
#me.live #acc{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
#dot{fill:var(--blue);stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke}
#me.sim #dot{fill:#fff;stroke:var(--blue);stroke-width:4}

/* ── controls ──────────────────────────────── */
.tools{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:4}
.tools button{
  width:46px;height:46px;border-radius:0;border:2.5px solid var(--ink);
  background:var(--signal);color:var(--ink);
  font-family:var(--display);font-size:19px;font-weight:800;line-height:1;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.55);
}
.tools button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.55)}
.tools button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tools button.ghost{background:var(--paper)}
#locate.busy{background:var(--paper-lo)}
#locate.busy .ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ico{display:block}

.legend{
  position:absolute;left:14px;bottom:14px;z-index:4;
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  color:rgba(238,235,226,.42);line-height:1.6;pointer-events:none;
}

/* ── notice ────────────────────────────────── */
.notice{
  position:absolute;left:14px;right:14px;bottom:70px;z-index:5;
  background:var(--paper);color:var(--ink);
  border-left:5px solid var(--signal);
  padding:12px 14px;font-size:13px;line-height:1.45;
  box-shadow:0 6px 0 rgba(0,0,0,.4);
  display:none;
}
.notice.show{display:block}
.notice h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}
.notice p{color:var(--ink-60)}
.notice .coord{display:none;gap:6px;margin-top:9px}
.notice .coord.show{display:flex}
.notice .coord input{
  flex:1;min-width:0;font-family:var(--mono);font-size:12px;
  border:2px solid var(--ink);background:#fff;color:var(--ink);padding:6px 8px;
}
.notice .coord input:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.notice .row{display:flex;gap:6px;flex-wrap:wrap}
.notice code{font-family:var(--mono);font-size:11.5px;background:rgba(14,14,14,.08);padding:1px 4px}
.notice button{
  margin-top:9px;background:var(--ink);color:var(--signal);border:0;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 12px;cursor:pointer;
}
.notice button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

@media (max-width:390px){
  h1#name{font-size:44px}
  .plate{padding:12px 15px 11px}
}
@media (min-width:760px){
  h1#name{font-size:72px}
  .plate{padding:20px 28px 18px}
  .strip-lbl{padding-left:28px}
  .meta{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>

<header class="plate">
  <div class="plate-top">
    <span class="eyebrow" id="eyebrow">Ortsteil</span>
    <span class="chip" id="chip" data-tone="warn">No fix</span>

  <h1 id="name"><span id="name-in">Berlin</span></h1>
  <p class="meta" id="meta">96 Ortsteile in 12 Bezirke. Tap the crosshair to find yours.</p>

      <button id="coord-go" style="margin-top:0">Use</button>
    </div>
    <div class="row"><button id="notice-x">Got it</button></div>
  </div>
</div>

/* ── projection ─────────────────────────────────────────── */
const W = 4000;
function merc(lon, lat){
  return [lon * Math.PI/180, -Math.log(Math.tan(Math.PI/4 + lat*Math.PI/720*2))];
}
let PB = null, H = 0;
(function fit(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const walk = c => { if(typeof c[0]==='number'){ const p=merc(c[0],c[1]);
      if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1];
    } else c.forEach(walk); };
  walk(CITY.g);
  const pad = 0.04, s = W*(1-2*pad)/(x1-x0);
  H = Math.round((y1-y0)*s + 2*pad*W);
  PB = {x0,y0,s,ox:W*pad,oy:W*pad};
})();
function proj(lon,lat){ const p=merc(lon,lat); return [(p[0]-PB.x0)*PB.s+PB.ox, (p[1]-PB.y0)*PB.s+PB.oy]; }
function unproj(X,Y){
  const mx=(X-PB.ox)/PB.s+PB.x0, my=(Y-PB.oy)/PB.s+PB.y0;
  return [mx*180/Math.PI, (2*Math.atan(Math.exp(-my))-Math.PI/2)*180/Math.PI];
}
document.getElementById('svg').setAttribute('viewBox', `0 0 ${W} ${H}`);

/* ── paths ──────────────────────────────────────────────── */
function toPath(g,t){
  const polys = t===1 ? [g] : g;
  let d='';
  for(const poly of polys) for(const ring of poly){
    for(let i=0;i<ring.length;i++){
      const p=proj(ring[i][0],ring[i][1]);
      d += (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
    }
    d+='Z';
  }
  return d;
}

/* ── geometry ───────────────────────────────────────────── */
function inRing(lon,lat,ring){
  let hit=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if((yi>lat)!==(yj>lat) && lon < (xj-xi)*(lat-yi)/(yj-yi)+xi) hit=!hit;
  }
  return hit;
}
function inFeature(lon,lat,f){
  if(lon<f.bb[0]||lon>f.bb[2]||lat<f.bb[1]||lat>f.bb[3]) return false;
  const polys = f.t===1 ? [f.g] : f.g;
  for(const poly of polys){
    if(!inRing(lon,lat,poly[0])) continue;
    let hole=false;
    for(let k=1;k<poly.length;k++) if(inRing(lon,lat,poly[k])){hole=true;break;}
    if(!hole) return true;
  }
  return false;
}
const MLAT = 111320;
function mlon(lat){ return 111320*Math.cos(lat*Math.PI/180); }
function edgeDist(lon,lat,f){
  const kx=mlon(lat), ky=MLAT;
  let best=Infinity, bx=0, by=0;
  const polys = f.t===1 ? [f.g] : f.g;
  for(const poly of polys) for(const ring of poly){
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const ax=(ring[j][0]-lon)*kx, ay=(ring[j][1]-lat)*ky;
      const bx2=(ring[i][0]-lon)*kx, by2=(ring[i][1]-lat)*ky;
      const dx=bx2-ax, dy=by2-ay, L=dx*dx+dy*dy;
      let t = L ? ((-ax)*dx + (-ay)*dy)/L : 0;
      t = t<0?0:t>1?1:t;
      const px=ax+t*dx, py=ay+t*dy, d=px*px+py*py;
      if(d<best){ best=d; bx=px; by=py; }
    }
  }
  return {d:Math.sqrt(best), dx:bx, dy:by};
}
const ARROWS=['↑','↗','→','↘','↓','↙','←','↖'];
function arrow(dx,dy){
  let a=(Math.atan2(dx,dy)*180/Math.PI+360)%360;
  return ARROWS[Math.round(a/45)%8];
}
function fmt(m){
  if(m<950) return Math.round(m/10)*10+' m';
  if(m<100000) return (m/1000).toFixed(m<10000?1:0)+' km';
  return Math.round(m/1000)+' km';
}

const svg=document.getElementById('svg'), cam=document.getElementById('cam');

function focusOn(lon,lat,scale){
  const p=proj(lon,lat), r=svg.getBoundingClientRect();

}
let pts=new Map(), moved=false, last=null, pinch=null;
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=false;
  if(pts.size===1){ last={x:e.clientX,y:e.clientY}; svg.classList.add('dragging'); }
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:cs,
    mx:(a.x+b.x)/2,my:(a.y+b.y)/2}; }
});
svg.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const k=W/svg.getBoundingClientRect().width;
  if(pts.size===2 && pinch){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const ns=Math.max(1,Math.min(60,pinch.s*(d/pinch.d)));
    const r=svg.getBoundingClientRect();
    const mx=((a.x+b.x)/2-r.left)*k, my=((a.y+b.y)/2-r.top)*k;
    cx = mx-(mx-cx)*(ns/cs); cy = my-(my-cy)*(ns/cs); cs=ns; apply(); moved=true;
  } else if(pts.size===1 && last){
    const dx=(e.clientX-last.x)*k, dy=(e.clientY-last.y)*k;
    if(Math.abs(e.clientX-last.x)>3||Math.abs(e.clientY-last.y)>3) moved=true;
    cx+=dx; cy+=dy; last={x:e.clientX,y:e.clientY}; apply();
  }
});
function up(e){ pts.delete(e.pointerId); if(pts.size<2) pinch=null; if(!pts.size){last=null;svg.classList.remove('dragging');} }
svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect(), k=W/r.width;
  const mx=(e.clientX-r.left)*k, my=(e.clientY-r.top)*k;
  const ns=Math.max(1,Math.min(60,cs*Math.pow(0.9993,e.deltaY)));
  cx=mx-(mx-cx)*(ns/cs); cy=my-(my-cy)*(ns/cs); cs=ns; apply();

svg.addEventListener('click',e=>{

  const r=svg.getBoundingClientRect(), k=W/r.width;
  const X=((e.clientX-r.left)*k-cx)/cs, Y=((e.clientY-r.top)*k-cy)/cs;
  const [lon,lat]=unproj(X,Y);
  setPosition(lon,lat,null,'tap');

/* ── position ───────────────────────────────────────────── */
const me=document.getElementById('me'), dot=document.getElementById('dot'),

function drawMe(){

                   .sort((a,b)=>a.e.d-b.e.d);

/* ── why is there no permission prompt? ─────────────────── */
function diagnose(){
  const framed = window.self !== window.top;
  const pp = document.permissionsPolicy || document.featurePolicy;
  let allowed = null;
  try{ if(pp && pp.allowsFeature) allowed = pp.allowsFeature('geolocation'); }catch(e){}
  return {
    framed,
    allowed,
    secure: window.isSecureContext,
    proto: location.protocol,
    hasApi: 'geolocation' in navigator
  };
}
function blockReason(d){
  if(!d.hasApi) return 'This browser exposes no geolocation API at all.';
  if(d.allowed === false) return d.framed
    ? 'The page is running inside an embedded frame that withholds the geolocation permission, so the browser will never show a prompt. Open this file in its own browser tab.'
    : 'A permissions policy on this page withholds geolocation.';
  if(!d.secure) return 'The page is not a secure context ('+d.proto+'). Browsers only offer location over https or on localhost.';
  if(d.proto === 'file:') return 'Chrome refuses location on file:// pages and shows no prompt. Firefox will prompt, or serve the file over http://localhost.';
  return null;
}
(function preflight(){
  const d = diagnose(), r = blockReason(d);
  if(r){
    elChip.textContent='Blocked'; elChip.dataset.tone='warn';
    say('Location will not be offered here', r + ' Meanwhile you can tap any shape, or type a coordinate pair below.', true);
  }
})();

/* ── geolocation ────────────────────────────────────────── */
const btn=document.getElementById('locate');
let watchId=null, firstFix=true;
function startWatch(){
  const pre=blockReason(diagnose());
  if(pre){ say('Location will not be offered here', pre+' Tap a shape or enter coordinates instead.', true); return; }
  btn.classList.add('busy');
  elChip.textContent='Locating'; elChip.dataset.tone='warn';
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  firstFix=true;
  watchId=navigator.geolocation.watchPosition(pos=>{
    btn.classList.remove('busy');
    notice.classList.remove('show');
    const c=pos.coords;
    setPosition(c.longitude,c.latitude,c.accuracy,'gps');
    if(firstFix){
      firstFix=false;
      const inside=OT.some(f=>inFeature(c.longitude,c.latitude,f));
      if(inside) focusOn(c.longitude,c.latitude,9); else reset();
    }
  }, err=>{
    btn.classList.remove('busy');
    elChip.textContent='No fix'; elChip.dataset.tone='warn';
    const d=diagnose(), r=blockReason(d);
    if(err.code===1) say('Location denied (code 1)',
      (r || 'You or the browser refused the request. Reset location permission for this site and tap the crosshair again.') +
      ' Tap a shape or enter coordinates to carry on.', true);
    else if(err.code===3) say('Location timed out (code 3)',
      'No fix within 15 seconds. Try again with a clearer view of the sky, or enter coordinates.', true);
    else say('Position unavailable (code 2)',
      'The device has location enabled but could not compute a fix'+(err.message?': '+err.message:'')+'. Enter coordinates to carry on.', true);
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:5000});
}
btn.onclick=startWatch;
document.getElementById('reset').onclick=reset;

fitName();
</script>
</body>
</html>
