  {h:"אהבה",t:"ahava",e:"love",c:"Social"},{h:"שמחה",t:"simcha",e:"joy / celebration",c:"Social"},{h:"כעס",t:"ka'as",e:"anger",c:"Social"},{h:"פחד",t:"pachad",e:"fear",c:"Social"},{h:"בעיה",t:"be'aya",e:"problem",c:"Social"},{h:"עזרה",t:"ezra",e:"help",c:"Social"},{h:"כוח",t:"ko'ach",e:"strength / power",c:"Social"},{h:"שקט",t:"sheket",e:"quiet / silence",c:"Social"},{h:"רעש",t:"ra'ash",e:"noise",c:"Social"},{h:"מילה",t:"mila",e:"word",c:"Social"},{h:"שפה",t:"safa",e:"language / lip",c:"Social"},{h:"עברית",t:"ivrit",e:"Hebrew",c:"Social"},{h:"אנגלית",t:"anglit",e:"English",c:"Social"},{h:"סיפור",t:"sipur",e:"story",c:"Social"},{h:"שאלה",t:"she'ela",e:"question",c:"Social"},{h:"תשובה",t:"tshuva",e:"answer",c:"Social"},{h:"אמת",t:"emet",e:"truth",c:"Social"},{h:"שקר",t:"sheker",e:"lie",c:"Social"},{h:"חופש",t:"chofesh",e:"freedom / vacation",c:"Social"},{h:"זמן",t:"zman",e:"time",c:"Social"}
];

const CATEGORIES = [...new Set(WORDS.map(w => w.c))];
const CC = {
  "Essentials":{a:"#e94560",l:"#ff6b81"},"Pronouns & People":{a:"#f5a623",l:"#ffc964"},
  "Connectors":{a:"#00b894",l:"#55efc4"},"Verbs":{a:"#6c5ce7",l:"#a29bfe"},
  "Descriptors":{a:"#fd79a8",l:"#fab1c4"},"Time":{a:"#00cec9",l:"#81ecec"},
  "Numbers":{a:"#fdcb6e",l:"#fde68a"},"Places & Things":{a:"#e17055",l:"#fab1a0"},
  "Body & Health":{a:"#d63031",l:"#ff7675"},"Phrases":{a:"#0984e3",l:"#74b9ff"},
  "Social":{a:"#a29bfe",l:"#c8c3ff"}
};

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function App() {
  const [mode, setMode] = useState("practice");
  const [selectedCats, setSelectedCats] = useState(new Set(["Essentials"]));
  const [deck, setDeck] = useState([]);
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [showBack, setShowBack] = useState(false);
  const [known, setKnown] = useState(new Set());
  const [retry, setRetry] = useState([]);
  const [listFilter, setListFilter] = useState("All");
  const [done, setDone] = useState(false);
  const [dir, setDir] = useState("heb2eng");

  useEffect(() => {
    if (flipped) {
      const t = setTimeout(() => setShowBack(true), 250);
      return () => clearTimeout(t);
    } else {
      setShowBack(false);
    }
  }, [flipped]);

  const startDeck = useCallback(() => {
    const pool = WORDS.filter(w => selectedCats.has(w.c));
    setDeck(shuffle(pool)); setIdx(0); setFlipped(false);
    setKnown(new Set()); setRetry([]); setDone(false);
  }, [selectedCats]);

  useEffect(() => { startDeck(); }, []);

  const toggleCat = (cat) => {
    setSelectedCats(prev => {
      const next = new Set(prev);
      next.has(cat) ? (next.size > 1 && next.delete(cat)) : next.add(cat);
      return next;
    });
  };

  const handleMark = (gotIt) => {
    const word = deck[idx];
    if (gotIt) setKnown(prev => new Set(prev).add(word.h + word.e));
    else setRetry(prev => [...prev, word]);
    if (idx < deck.length - 1) { setIdx(idx + 1); setFlipped(false); }
    else if (retry.length > 0 || !gotIt) {
      const r = gotIt ? [...retry] : [...retry, word];
      setDeck(shuffle(r)); setRetry([]); setIdx(0); setFlipped(false);
    } else setDone(true);
  };

  const w = deck[idx];
  const co = w ? (CC[w.c] || CC.Essentials) : CC.Essentials;
  const selCount = WORDS.filter(w => selectedCats.has(w.c)).length;

  const s = (obj) => obj; // style passthrough

  // Pill button helper
  const pill = (active, accent, light, label, onClick) =>
    e("button", { key: label, onClick, style: s({
      padding:"5px 12px",borderRadius:8,fontSize:12,border:"1.5px solid "+(active?accent+"":"#ffffff15"),
      background:active?accent+"20":"transparent",color:active?light:"#ffffff40",cursor:"pointer",
      transition:"all 0.2s",whiteSpace:"nowrap"
    })}, label);

  if (mode === "list") {
    const filtered = listFilter === "All" ? WORDS : WORDS.filter(w => w.c === listFilter);
    return e("div", {style:{minHeight:"100vh",background:"#0f0f23",color:"#fff",padding:"24px 16px",fontFamily:"'Segoe UI',-apple-system,sans-serif"}},
      e("div", {style:{maxWidth:800,margin:"0 auto"}},
        // Header
        e("div",{style:{display:"flex",alignItems:"baseline",gap:12,marginBottom:4}},
          e("h1",{style:{fontSize:28,fontWeight:700,margin:0,fontFamily:"'Crimson Pro',serif",background:"linear-gradient(135deg,#e94560,#f5a623)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"עברית"),
          e("span",{style:{fontSize:16,color:"#ffffff40",fontFamily:"'Crimson Pro',serif"}},WORDS.length+" words")
        ),
        // Tabs
        e("div",{style:{display:"flex",gap:4,margin:"20px 0 24px"}},
          ["practice","list"].map(t => e("button",{key:t,onClick:()=>setMode(t),style:{
            padding:"8px 20px",borderRadius:10,border:"none",background:mode===t?"#ffffff15":"transparent",
            color:mode===t?"#fff":"#ffffff50",fontSize:14,cursor:"pointer",fontWeight:mode===t?600:400
          }},t==="practice"?"Flashcards":"Word List"))
        ),
        // Filters
        e("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:20}},
          pill(listFilter==="All","#e94560","#ff6b81","All ("+WORDS.length+")",()=>setListFilter("All")),
          CATEGORIES.map(cat => pill(listFilter===cat,CC[cat].a,CC[cat].l,cat,()=>setListFilter(cat)))
        ),
        // Table
        e("div",{style:{maxHeight:"70vh",overflowY:"auto",WebkitOverflowScrolling:"touch"}},
          e("table",{style:{width:"100%",borderCollapse:"separate",borderSpacing:"0 4px"}},
            e("thead",null,e("tr",{style:{position:"sticky",top:0,background:"#0f0f23",zIndex:2}},
              ["Hebrew","Sounds like","Meaning"].map(h=>e("th",{key:h,style:{padding:"10px 8px",textAlign:"left",fontSize:11,letterSpacing:2,color:"#ffffff50",textTransform:"uppercase",borderBottom:"1px solid #ffffff15"}},h))
            )),
            e("tbody",null,filtered.map((w,i)=>{
              const c=CC[w.c]||CC.Essentials;
              return e("tr",{key:i,style:{background:i%2===0?"#ffffff04":"transparent"}},
                e("td",{style:{padding:"8px",fontSize:22,fontFamily:"serif",direction:"rtl",color:"#fff"}},w.h),
                e("td",{style:{padding:"8px",fontSize:14,color:c.l,fontStyle:"italic"}},w.t),
                e("td",{style:{padding:"8px",fontSize:14,color:"#ffffffcc"}},w.e)
              );
            }))
          )
        )
      )
    );
  }

  // Practice mode
  return e("div",{style:{minHeight:"100vh",background:"#0f0f23",color:"#fff",padding:"24px 16px",fontFamily:"'Segoe UI',-apple-system,sans-serif"}},
    e("div",{style:{maxWidth:800,margin:"0 auto"}},
      // Header
      e("div",{style:{display:"flex",alignItems:"baseline",gap:12,marginBottom:4}},
        e("h1",{style:{fontSize:28,fontWeight:700,margin:0,fontFamily:"'Crimson Pro',serif",background:"linear-gradient(135deg,#e94560,#f5a623)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"עברית"),
        e("span",{style:{fontSize:16,color:"#ffffff40",fontFamily:"'Crimson Pro',serif"}},WORDS.length+" words")
      ),
      // Tabs
      e("div",{style:{display:"flex",gap:4,margin:"20px 0 24px"}},
        ["practice","list"].map(t => e("button",{key:t,onClick:()=>setMode(t),style:{
          padding:"8px 20px",borderRadius:10,border:"none",background:mode===t?"#ffffff15":"transparent",
          color:mode===t?"#fff":"#ffffff50",fontSize:14,cursor:"pointer",fontWeight:mode===t?600:400
        }},t==="practice"?"Flashcards":"Word List"))
      ),
      // Category selector
      e("div",{style:{marginBottom:16}},
        e("div",{style:{fontSize:11,letterSpacing:2,color:"#ffffff40",textTransform:"uppercase",marginBottom:10}},
          "Categories ("+selCount+" words selected)"),
        e("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
          CATEGORIES.map(cat => {
            const cnt = WORDS.filter(w=>w.c===cat).length;
            return pill(selectedCats.has(cat),CC[cat].a,CC[cat].l,cat+" ("+cnt+")",()=>toggleCat(cat));
          })
        )
      ),
      // Direction + Start
      e("div",{style:{display:"flex",gap:12,alignItems:"center",marginBottom:24,flexWrap:"wrap"}},
        e("button",{onClick:()=>setDir(d=>d==="heb2eng"?"eng2heb":"heb2eng"),style:{
          padding:"6px 14px",borderRadius:8,fontSize:12,border:"1.5px solid #ffffff20",
          background:"#ffffff08",color:"#ffffffaa",cursor:"pointer"
        }},dir==="heb2eng"?"Hebrew → English":"English → Hebrew"),
        e("button",{onClick:startDeck,style:{
          padding:"8px 24px",borderRadius:10,border:"none",
          background:"linear-gradient(135deg,#e94560,#f5a623)",
          color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"
        }},deck.length>0?"Shuffle & Restart":"Start")
      ),
      // Session done
      done && e("div",{style:{textAlign:"center",padding:48,background:"#ffffff06",borderRadius:20}},
        e("div",{style:{fontSize:48,marginBottom:16}},"✓"),
        e("div",{style:{fontSize:22,fontWeight:600,color:"#55efc4",marginBottom:8}},"Session Complete"),
        e("div",{style:{fontSize:14,color:"#ffffff60",marginBottom:24}},"You cleared all the cards!"),
        e("button",{onClick:startDeck,style:{padding:"10px 24px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#e94560,#f5a623)",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}},"Go Again")
      ),
      // Card
      !done && w && e("div",{style:{perspective:800,width:"100%",maxWidth:420,margin:"0 auto"}},
        e("div",{className:"card-inner",onClick:()=>setFlipped(!flipped),style:{
          width:"100%",minHeight:280,cursor:"pointer",position:"relative",
          transformStyle:"preserve-3d",transition:"transform 0.5s cubic-bezier(0.4,0,0.2,1)",
          transform:flipped?"rotateY(180deg)":"rotateY(0)"
        }},
          // Front
          e("div",{className:"card-face",style:{
            position:"absolute",inset:0,backfaceVisibility:"hidden",WebkitBackfaceVisibility:"hidden",
            background:"linear-gradient(145deg,#16213e 0%,#1a1a2e 100%)",
            borderRadius:20,border:"2px solid "+co.a+"40",
            display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
            padding:32,boxShadow:"0 8px 32px "+co.a+"20"
          }},
            e("div",{style:{fontSize:11,letterSpacing:3,color:co.l,opacity:.6,textTransform:"uppercase",marginBottom:16}},w.c),
            dir==="heb2eng"
              ? e("div",null,
                  e("div",{style:{fontSize:56,color:"#fff",marginBottom:12,fontFamily:"serif",direction:"rtl",lineHeight:1.2,textAlign:"center"}},w.h),
                  e("div",{style:{fontSize:22,color:co.l,fontStyle:"italic",letterSpacing:1,textAlign:"center"}},w.t)
                )
              : e("div",{style:{fontSize:28,color:"#fff",fontWeight:600,textAlign:"center",lineHeight:1.4}},w.e),
            e("div",{style:{position:"absolute",bottom:16,fontSize:12,color:"#ffffff30"}},"tap to reveal")
          ),
          // Back
          e("div",{className:"card-face",style:{
            position:"absolute",inset:0,backfaceVisibility:"hidden",WebkitBackfaceVisibility:"hidden",transform:"rotateY(180deg)",
            background:"linear-gradient(145deg,"+co.a+"15,#16213e)",
            borderRadius:20,border:"2px solid "+co.a+"80",
            display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
            padding:32,boxShadow:"0 8px 32px "+co.a+"30"
          }},
            e("div",{style:{opacity:showBack?1:0,transition:"opacity 0.15s",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}},
            dir==="heb2eng"
              ? e("div",null,
                  e("div",{style:{fontSize:36,color:"#fff",fontFamily:"serif",direction:"rtl",marginBottom:8,opacity:.5}},w.h),
                  e("div",{style:{fontSize:16,color:co.l,fontStyle:"italic",marginBottom:24,opacity:.5}},w.t),
                  e("div",{style:{fontSize:32,color:"#fff",fontWeight:600,textAlign:"center",lineHeight:1.3}},w.e)
                )
              : e("div",null,
                  e("div",{style:{fontSize:14,color:"#ffffff60",marginBottom:8}},w.e),
                  e("div",{style:{fontSize:56,color:"#fff",fontFamily:"serif",direction:"rtl",marginBottom:12,textAlign:"center"}},w.h),
                  e("div",{style:{fontSize:22,color:co.l,fontStyle:"italic",textAlign:"center"}},w.t)
                )
            )
          )
        ),
        // Progress + buttons
        e("div",{style:{textAlign:"center",marginTop:20}},
          e("div",{style:{fontSize:13,color:"#ffffff40",marginBottom:16}},(idx+1)+" / "+deck.length),
          e("div",{style:{display:"flex",gap:12,justifyContent:"center"}},
            e("button",{onClick:(ev)=>{ev.stopPropagation();handleMark(false);},style:{
              padding:"14px 32px",borderRadius:12,border:"2px solid #e9456040",
              background:"#e9456015",color:"#ff6b81",fontSize:16,cursor:"pointer",fontWeight:600
            }},"Again"),
            e("button",{onClick:(ev)=>{ev.stopPropagation();handleMark(true);},style:{
              padding:"14px 32px",borderRadius:12,border:"2px solid "+co.a+"60",
              background:co.a+"15",color:co.l,fontSize:16,cursor:"pointer",fontWeight:600
            }},"Got it")
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
